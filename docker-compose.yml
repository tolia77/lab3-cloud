services:
  postgres:
    image: postgres:15
    container_name: football_postgres
    restart: always
    environment:
      POSTGRES_USER: localuser
      POSTGRES_PASSWORD: localpass
      POSTGRES_DB: localdb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: football_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: football_api
    restart: always
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    volumes:
      - .:/app
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USERNAME: localuser
      PG_PASSWORD: localpass
      PG_DB_NAME: localdb

      REDIS_HOST: redis
      REDIS_PORT: 6379

      PORT: 8080
    ports:
      - "8080:8080"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8080"

volumes:
  pgdata:
